name: Update Portfolio (Daily)

on:
  # 通常は Vercel Cron（vercel.json → /api/cron/*）が workflow_dispatch で起動する。GitHub の schedule は
  # 数時間遅れることがあるため予備扱い（外部起動が成功していれば guard ジョブがスキップする）
  schedule:
    # 平日 JST 07:00 = UTC 22:00, Sun-Thu（US 引け確定 + JP 寄り前の時間帯）
    - cron: '0 22 * * 0-4'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  # 予備の schedule 起動は、外部起動（workflow_dispatch）が成功済みならスキップする
  guard:
    permissions:
      actions: read
    uses: ./.github/workflows/_fallback-guard.yml
    with:
      workflow: update-portfolio.yml

  snapshot-portfolio:
    needs: guard
    # guard 自体が失敗したときは止めずに実行する
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # 差分 append モード。新規取引日が 1 日以上ある場合のみ JSON を書き換える
      - run: npm run snapshot:portfolio
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/portfolio-history.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolio-history.json
          git commit -m "chore(portfolio): daily NAV update $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
