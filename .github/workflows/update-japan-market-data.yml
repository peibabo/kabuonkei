name: Update Japan Market Data

on:
  schedule:
    # 水 10:00 JST = 火曜 JPX 公表の裁定残・信用倍率を翌朝取り込み
    # 金 10:00 JST = 木曜 JPX 公表の投資主体別売買動向を翌朝取り込み
    - cron: '0 1 * * 3,5'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update-japan-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run generate:japan-market
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/japan-market-data.json
          git commit -m "chore: 日本市場データを更新（$(date +%Y-%m-%d)）"
          git push
