name: Snapshot Japan Fear Greed

on:
  schedule:
    # 平日 17:00 JST（東証クローズ後） = UTC 08:00, Mon-Fri
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  snapshot-japan-fg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run snapshot:japan-fg
      # 簡易版（10年分のC1+C5スコア）も毎日リフレッシュして Area が今日まで連続するようにする
      - run: npm run generate:japan-temperature-history
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/japan-fg-snapshots.json src/data/japan-temperature-history.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/japan-fg-snapshots.json src/data/japan-temperature-history.json
          git commit -m "chore: 日本版FGスナップショット + 温度推移を更新（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
          git push
