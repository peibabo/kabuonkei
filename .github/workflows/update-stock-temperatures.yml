name: Update Stock Temperatures

on:
  # 通常は Vercel Cron（vercel.json → /api/cron/*）が workflow_dispatch で起動する。GitHub の schedule は
  # 数時間遅れることがあるため予備扱い（二重に実行されても結果は変わらない）
  schedule:
    # 平日 16:30 JST（東証クローズ後） = UTC 07:30, Mon-Fri
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update-stock-temperatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # 取得成功率が 90% 未満ならスクリプトが異常終了し、既存データは上書きされない。
      # 個別に失敗した銘柄は前回の値を引き継ぐ
      - run: npm run generate:stock-temperatures
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/stock-temperatures.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stock-temperatures.json
          git commit -m "chore: 銘柄別温度を更新（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
          # 同じ時間帯に別のデータ更新ジョブが先に push していても失敗しないようにする
          git pull --rebase
          git push
