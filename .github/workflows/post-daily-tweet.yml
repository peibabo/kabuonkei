name: Post Daily Temperature Tweet

on:
  # 通常は Vercel Cron（vercel.json → /api/cron/morning）が平日 JST 7 時台に workflow_dispatch で起動する。
  # GitHub の schedule は数時間遅れることがあるため予備扱い。外部起動が動かなかった日だけ投稿する
  schedule:
    # 平日 JST 08:45（東証の寄り付き前）= UTC 23:45, Sun-Thu
    - cron: '45 23 * * 0-4'
  workflow_dispatch: # Vercel Cron からの起動、手動実行

permissions:
  contents: read

jobs:
  # 予備の schedule 起動は、外部起動（workflow_dispatch）が成功済みならスキップする
  guard:
    permissions:
      actions: read
    uses: ./.github/workflows/_fallback-guard.yml
    with:
      workflow: post-daily-tweet.yml

  post-daily-tweet:
    needs: guard
    # guard 自体が失敗したときは止めずに実行する
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # X API が 402（Payment Required）を返すようになったため（2026-11-06〜）、X には投稿せず
      # 投稿文＋温度カード画像を運営者にメールし、人が（またはアシスタントが）手動で投稿する。
      # X API での自動投稿に戻すときは --email を外し、X_API_* を env に戻す
      - run: npm run post:daily-tweet -- --email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          # 送り先。未設定なら OPS_ALERT_EMAIL → info@kabuonkei.com
          X_DRAFT_EMAIL: ${{ vars.X_DRAFT_EMAIL }}
          OPS_ALERT_EMAIL: ${{ vars.OPS_ALERT_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
