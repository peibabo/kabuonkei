<!doctype html>
<!-- note 第2弾 検証1 期間別テーブル（1200×585 を 2x 撮影）。配色は日本式（プラス=赤 / マイナス=青） -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 585px; background: #fafaf7; color: #111; padding: 46px 56px 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; position: relative;
  }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: -0.01em; }
  .sub { margin-top: 18px; font-size: 17px; color: #6b7280; }
  table { margin-top: 28px; width: 100%; border-collapse: collapse; }
  th { background: #111827; color: #fff; font-size: 17px; font-weight: 800; height: 56px; text-align: center; }
  th:first-child, td:first-child { text-align: left; padding-left: 20px; }
  td { height: 62px; text-align: center; font-size: 22px; color: #374151; border-bottom: 1px solid #e5e7eb; }
  td:first-child { font-size: 21px; font-weight: 800; color: #111; }
  tr.hl td { background: #eff6ff; height: 66px; }
  .up { color: #dc2626; font-weight: 800; font-size: 25px; }
  .down { color: #2563eb; font-weight: 800; font-size: 23px; }
  .note { position: absolute; left: 56px; bottom: 34px; font-size: 14px; color: #6b7280; }
  .credit { position: absolute; right: 56px; bottom: 30px; font-size: 17px; font-weight: 700; color: #4b5563; }
</style>
</head>
<body>
  <h1>「極寒」の日に日経平均を買った場合——保有期間別の成績</h1>
  <p class="sub">2017年5月〜2026年11月に温度が極寒（0〜20°）だった111日を集計（2要素簡易版スコア）</p>
  <table>
    <tr><th>保有期間</th><th>勝率</th><th>平均リターン</th><th>中央値</th><th>最悪のケース</th></tr>
    <tr><td>1週間後</td><td>67.6%</td><td>+0.9%</td><td>+1.4%</td><td><span class="down">-16.0%</span></td></tr>
    <tr><td>1ヶ月後</td><td>87.4%</td><td>+4.7%</td><td>+5.0%</td><td><span class="down">-15.6%</span></td></tr>
    <tr class="hl"><td>3ヶ月後</td><td><span class="up">100%</span></td><td><span class="up">+11.5%</span></td><td><span class="up">+9.6%</span></td><td><span class="up">+1.4%</span></td></tr>
    <tr><td>6ヶ月後</td><td>99.1%</td><td>+20.6%</td><td>+20.5%</td><td><span class="down">-0.1%</span></td></tr>
  </table>
  <p class="note">※過去の統計であり将来のリターンを保証するものではありません</p>
  <div class="credit">🌡️ kabuonkei.com</div>
</body>
</html>
