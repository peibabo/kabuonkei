name: Update Japan Market Data

on:
  schedule:
    # 水 17:00 JST = 当日 15:00 JPX 公表の信用倍率を同日中に取り込み
    # 木 17:00 JST = 当日 15:30 JPX 公表の投資主体別売買動向を同日中に取り込み
    # 裁定残は毎営業日 16:00 JST に T+2 営業日分が公表されるのでどちらの回でも取れる
    - cron: '0 8 * * 3,4'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update-japan-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run generate:japan-market
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/japan-market-data.json
          git commit -m "chore: 日本市場データを更新（$(date +%Y-%m-%d)）"
          git push
