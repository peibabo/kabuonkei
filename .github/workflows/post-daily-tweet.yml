name: Post Daily Temperature Tweet

on:
  # 通常は Vercel Cron（vercel.json → /api/cron/morning）が平日 JST 7 時台に workflow_dispatch で起動する。
  # GitHub の schedule は数時間遅れることがあるため予備扱い。外部起動が動かなかった日だけ投稿する
  schedule:
    # 平日 JST 08:45（東証の寄り付き前）= UTC 23:45, Sun-Thu
    - cron: '45 23 * * 0-4'
  workflow_dispatch: # Vercel Cron からの起動、手動実行

permissions:
  contents: read

jobs:
  # 予備の schedule 起動は、外部起動（workflow_dispatch）が成功済みならスキップする
  guard:
    permissions:
      actions: read
    uses: ./.github/workflows/_fallback-guard.yml
    with:
      workflow: post-daily-tweet.yml

  post-daily-tweet:
    needs: guard
    # guard 自体が失敗したときは止めずに実行する
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run post:daily-tweet
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
