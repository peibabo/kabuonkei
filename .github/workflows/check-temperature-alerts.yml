name: Check Temperature Alerts

on:
  # 通常は Vercel Cron（vercel.json → /api/cron/*）が workflow_dispatch で起動する。GitHub の schedule は
  # 数時間遅れることがあるため予備扱い（二重に実行されても結果は変わらない）
  schedule:
    # 米国版: 平日 JST 07:00 = UTC 22:00, Sun-Thu（X Bot 07:30 の直前）
    - cron: '0 22 * * 0-4'
    # 日本版: 平日 JST 17:15 = UTC 08:15, Mon-Fri（snapshot-japan-fg の 17:00 直後）
    - cron: '15 8 * * 1-5'
  workflow_dispatch:
    inputs:
      variant:
        description: 'us or jp'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - jp
      dry_run:
        description: 'dry-run (メール送信せず対象のみ出力)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Resolve variant and dry-run from event
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
            else
              echo "dry=" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.schedule }}" = "0 22 * * 0-4" ]; then
            echo "variant=us" >> "$GITHUB_OUTPUT"
            echo "dry=" >> "$GITHUB_OUTPUT"
          else
            echo "variant=jp" >> "$GITHUB_OUTPUT"
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi
      # snapshot-japan-fg (17:00 JST) の commit が cron 遅延でまだ push されていない場合に備え、
      # 直近営業日のスナップショットが main に現れるまで最大 12 分ポーリングする。
      # スナップショットの日付は日経225 の最終取引日。このジョブ自体も遅延して翌日未明に走ることが
      # あるため、「翌朝 9:00 JST の寄り付きまでは前日分」= UTC 日付を待ち受ける日付とする。
      # 休場日は一致しないまま抜けるが、スクリプト側が最終取引日と照合するので失敗にはならない。
      # タイムアウトしてもここでは失敗させず、スクリプト側の鮮度ガード（古い値なら exit 1）に委ねる。
      - name: Wait for the latest JP snapshot (jp variant only)
        if: steps.resolve.outputs.variant == 'jp'
        run: |
          FILE=src/data/japan-fg-snapshots.json
          TODAY=$(TZ=UTC date +%F)
          for i in $(seq 1 6); do
            LATEST=$(node -e "const s=require('./$FILE').snapshots; console.log(s[s.length-1]?.date ?? '')")
            if [ "$LATEST" = "$TODAY" ]; then
              echo "直近営業日のスナップショットを確認: $LATEST"
              exit 0
            fi
            echo "スナップショット待ち (latest=$LATEST, expected=$TODAY)。120秒待って再取得 ($i/6)"
            sleep 120
            git fetch origin main --depth 1
            git checkout origin/main -- "$FILE"
          done
          echo "::warning::待ち受けた日付のスナップショットを確認できませんでした（休場日なら正常）。スクリプト側の鮮度ガードが判定します"
      - run: npm run alerts:check -- --variant ${{ steps.resolve.outputs.variant }} ${{ steps.resolve.outputs.dry }}
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # サンドボックス（onboarding@resend.dev）への暗黙フォールバックは沈黙失敗の原因になるため
          # 既定値を置かない。未設定ならスクリプト側のプリフライトが exit 1 で落とす
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          ALERTS_TOKEN_SECRET: ${{ secrets.ALERTS_TOKEN_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
