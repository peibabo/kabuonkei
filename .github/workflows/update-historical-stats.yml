name: Update Historical Stats

on:
  schedule:
    # 毎月1日 午前9時 JST（UTC 0:00）
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run generate:stats
      - run: npm run generate:temperature-history
      - run: npm run generate:japan-stats
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/historical-stats.json src/data/temperature-history.json src/data/japan-historical-stats.json
          git commit -m "chore: 統計データを更新（$(date +%Y-%m-%d)）"
          git push
