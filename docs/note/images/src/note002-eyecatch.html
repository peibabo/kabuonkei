<!doctype html>
<!-- note 第2弾アイキャッチ（1280×670 を 2x 撮影）。数字は japan-temperature-history.json の実値 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 670px; background: #fafaf7; color: #111;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    position: relative; overflow: hidden;
  }
  .kicker { position: absolute; left: 72px; top: 64px; font-size: 22px; font-weight: 700; color: #2563eb; letter-spacing: 0.04em; }
  h1 { position: absolute; left: 72px; top: 108px; font-size: 62px; font-weight: 900; line-height: 1.22; letter-spacing: -0.01em; }
  h1 .hl { color: #dc2626; }
  .lead { position: absolute; left: 72px; top: 276px; width: 500px; font-size: 21px; line-height: 1.6; color: #6b7280; }
  .foot { position: absolute; left: 72px; bottom: 96px; width: 620px; white-space: nowrap; font-size: 16px; line-height: 1.75; color: #6b7280; }
  .credit { position: absolute; right: 72px; bottom: 36px; font-size: 19px; font-weight: 700; color: #4b5563; }
  .chart { position: absolute; right: 72px; bottom: 136px; display: flex; align-items: flex-end; gap: 34px; height: 310px; }
  .col { width: 118px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .val { font-size: 28px; font-weight: 800; color: #374151; margin-bottom: 8px; }
  .bar { width: 100%; background: #9ca3af; border-radius: 6px 6px 0 0; }
  .lab { position: absolute; bottom: -40px; font-size: 18px; font-weight: 600; color: #6b7280; }
  .col { position: relative; }
  .col.hot .val { color: #dc2626; font-size: 34px; font-weight: 900; }
  .col.hot .bar { background: #dc2626; }
  .col.hot .lab { color: #111; font-weight: 800; }
</style>
</head>
<body>
  <div class="kicker">株温計・データ検証 第2弾</div>
  <h1>「極寒で買えば<span class="hl">勝率100%</span>」<br>を疑え</h1>
  <p class="lead">市場温度0〜20°の111日に日経平均を<br>買っていたら——保有期間別の勝率</p>
  <p class="foot">2017年5月〜2026年11月の2,317営業日をバックテスト<br>※過去の統計であり将来のリターンを保証するものではありません</p>
  <!-- 棒の高さ = 勝率 × 2.5px -->
  <div class="chart">
    <div class="col"><div class="val">67.6%</div><div class="bar" style="height:169px"></div><div class="lab">1週間後</div></div>
    <div class="col"><div class="val">87.4%</div><div class="bar" style="height:219px"></div><div class="lab">1ヶ月後</div></div>
    <div class="col hot"><div class="val">100%</div><div class="bar" style="height:250px"></div><div class="lab">3ヶ月後</div></div>
    <div class="col"><div class="val">99.1%</div><div class="bar" style="height:248px"></div><div class="lab">6ヶ月後</div></div>
  </div>
  <div class="credit">🌡️ kabuonkei.com</div>
</body>
</html>
