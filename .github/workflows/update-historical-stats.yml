name: Update Historical Stats

on:
  # 通常は Vercel Cron（vercel.json → /api/cron/*）が workflow_dispatch で起動する。GitHub の schedule は
  # 数時間遅れることがあるため予備扱い（外部起動が成功していれば guard ジョブがスキップする）
  schedule:
    # 毎月1日 午前9時 JST（UTC 0:00）
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  # 予備の schedule 起動は、外部起動（workflow_dispatch）が成功済みならスキップする
  guard:
    permissions:
      actions: read
    uses: ./.github/workflows/_fallback-guard.yml
    with:
      workflow: update-historical-stats.yml

  update-stats:
    needs: guard
    # guard 自体が失敗したときは止めずに実行する
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run generate:stats
      - run: npm run generate:temperature-history
      - run: npm run generate:japan-stats
      - run: npm run generate:japan-temperature-history
      - run: npm run generate:similar-days
      - run: npm run generate:cross-stats
      - run: npm run generate:sector-heatmap
      # score-distribution は japan-temperature-history.json を読み込むため、
      # 上記 generate:japan-temperature-history の後で実行する必要がある
      - run: npm run generate:score-distribution
      # margin-history は JPX 連結 XLS を取得して 20 年超の週次データを再生成する。
      # 続く margin-analysis は margin-history.json + japan-temperature-history.json を読むため、
      # generate:japan-temperature-history の後に置く必要がある
      - run: npm run generate:margin-history
      - run: npm run generate:margin-analysis
      # vix-sp500 は japan-temperature-history.json を読むため、
      # generate:japan-temperature-history の後に置く必要がある
      - run: npm run generate:vix-sp500
      # divergence は japan-temperature-history.json と Yahoo VIX を読むため、
      # generate:japan-temperature-history の後に置く必要がある
      - run: npm run generate:divergence
      # 日経225 の急落後の検証（/analysis/nikkei-crash-aftermath）。Yahoo の ^N225 だけを読む
      - run: npm run generate:nikkei-crash
      # 日経225 の 125 日移動平均乖離率ごとのその後（/analysis/nikkei-ma-deviation）。Yahoo の ^N225 だけを読む
      - run: npm run generate:nikkei-ma-deviation
      # 投資部門別（週次・二市場）の推移に、まだない週を JPX から足す。続く learn-extra が読む。
      # JPX が一時的に読めなくても他の統計の更新を止めないよう、失敗しても先に進む（JSON は書き換えずに前回分のまま）
      - run: npm run update:investor-flow
        continue-on-error: true
      # 解説記事（日経VI・ドル円・裁定残・投資部門別）の補足集計。Yahoo の ^N225 と JPY=X、
      # 上の investor-flow-history.json を読む
      - run: npm run generate:learn-extra
      # portfolio-history は japan-temperature-history.json を読むため、
      # generate:japan-temperature-history の後に置く必要がある。月次で全再生成
      # することで、差分 append モードで累積した小さなズレをリセットする
      - run: npm run generate:portfolio-history
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/historical-stats.json src/data/temperature-history.json src/data/japan-historical-stats.json src/data/japan-temperature-history.json src/data/japan-similar-days.json src/data/us-similar-days.json src/data/events-enriched.json src/data/cross-historical-stats.json src/data/japan-sector-heatmap.json src/data/score-distribution.json src/data/margin-ratio-history.json src/data/margin-ratio-analysis.json src/data/vix-sp500-analysis.json src/data/divergence-analysis.json src/data/nikkei-crash-analysis.json src/data/nikkei-ma-deviation-analysis.json src/data/learn-extra-stats.json src/data/investor-flow-history.json src/data/portfolio-history.json
          git commit -m "chore: 統計データを更新（$(date +%Y-%m-%d)）"
          git push
