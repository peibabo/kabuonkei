name: Update Historical Stats

on:
  schedule:
    # 毎月1日 午前9時 JST（UTC 0:00）
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run generate:stats
      - run: npm run generate:temperature-history
      - run: npm run generate:japan-stats
      - run: npm run generate:japan-temperature-history
      - run: npm run generate:similar-days
      - run: npm run generate:cross-stats
      - run: npm run generate:sector-heatmap
      # score-distribution は japan-temperature-history.json を読み込むため、
      # 上記 generate:japan-temperature-history の後で実行する必要がある
      - run: npm run generate:score-distribution
      # margin-history は JPX 連結 XLS を取得して 20 年超の週次データを再生成する。
      # 続く margin-analysis は margin-history.json + japan-temperature-history.json を読むため、
      # generate:japan-temperature-history の後に置く必要がある
      - run: npm run generate:margin-history
      - run: npm run generate:margin-analysis
      # vix-sp500 は japan-temperature-history.json を読むため、
      # generate:japan-temperature-history の後に置く必要がある
      - run: npm run generate:vix-sp500
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/historical-stats.json src/data/temperature-history.json src/data/japan-historical-stats.json src/data/japan-temperature-history.json src/data/japan-similar-days.json src/data/us-similar-days.json src/data/cross-historical-stats.json src/data/japan-sector-heatmap.json src/data/score-distribution.json src/data/margin-ratio-history.json src/data/margin-ratio-analysis.json src/data/vix-sp500-analysis.json
          git commit -m "chore: 統計データを更新（$(date +%Y-%m-%d)）"
          git push
