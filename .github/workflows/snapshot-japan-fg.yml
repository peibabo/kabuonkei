name: Update Japan Temperature History

on:
  # 通常は Vercel Cron（vercel.json → /api/cron/*）が workflow_dispatch で起動する。GitHub の schedule は
  # 数時間遅れることがあるため予備扱い（外部起動が成功していれば guard ジョブがスキップする）
  schedule:
    # 平日 17:00 JST（東証クローズ後） = UTC 08:00, Mon-Fri
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  # 予備の schedule 起動は、外部起動（workflow_dispatch）が成功済みならスキップする
  guard:
    permissions:
      actions: read
    uses: ./.github/workflows/_fallback-guard.yml
    with:
      workflow: snapshot-japan-fg.yml

  snapshot-japan-fg:
    needs: guard
    # guard 自体が失敗したときは止めずに実行する
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # 市場温度（日経225 × 125日移動平均乖離）の過去推移を全期間再生成する。
      # 推移・前日比・連続日数・日本版アラートはこのファイルを見る（2026-11 に 5 要素スナップショットの記録を停止）
      - run: npm run generate:japan-temperature-history
      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/japan-temperature-history.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/japan-temperature-history.json
          git commit -m "chore: 日本版 市場温度の推移を更新（$(node -p "require('./src/data/japan-temperature-history.json').daily.at(-1).date")）"
          # 同じ時間帯に別のデータ更新ジョブが先に push していても失敗しないようにする
          git pull --rebase
          git push
