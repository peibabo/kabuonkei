<!doctype html>
<!-- note 第3弾アイキャッチ（1280×670 を 2x 撮影）。数字は nikkei-crash-analysis.json（2026-11-18 生成）の実値 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 670px; background: #fafaf7; color: #111;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    position: relative; overflow: hidden;
  }
  .kicker { position: absolute; left: 72px; top: 64px; font-size: 22px; font-weight: 700; color: #2563eb; letter-spacing: 0.04em; }
  h1 { position: absolute; left: 72px; top: 108px; font-size: 60px; font-weight: 900; line-height: 1.25; letter-spacing: -0.01em; }
  h1 .hl { color: #2563eb; }
  .lead { position: absolute; left: 72px; top: 296px; width: 560px; font-size: 21px; line-height: 1.6; color: #6b7280; }
  .foot { position: absolute; left: 72px; bottom: 96px; width: 640px; white-space: nowrap; font-size: 16px; line-height: 1.75; color: #6b7280; }
  .credit { position: absolute; right: 72px; bottom: 36px; font-size: 19px; font-weight: 700; color: #4b5563; }
  .panel { position: absolute; right: 72px; top: 100px; width: 430px; }
  .grid { display: grid; grid-template-columns: repeat(5, 54px); gap: 10px; }
  .cell { width: 54px; height: 54px; border-radius: 8px; background: #e5e7eb; }
  .cell.hit { background: #111827; }
  .big { margin-top: 22px; font-size: 28px; font-weight: 800; color: #111; line-height: 1.4; }
  .big strong { font-size: 48px; font-weight: 900; }
  .cap { margin-top: 6px; font-size: 16px; line-height: 1.5; color: #6b7280; }
</style>
</head>
<body>
  <div class="kicker">株温計・データ検証 第3弾</div>
  <h1>日経平均 <span class="hl">-6%</span> の日は<br>「底」だったのか</h1>
  <p class="lead">1985年以降、1日で5%以上下げた急落26回。<br>その後の株価を全部追いかけた</p>
  <p class="foot">日経平均の終値（1985年1月〜2026年11月18日）で集計<br>※過去の統計であり将来のリターンを保証するものではありません</p>
  <div class="panel">
    <!-- 6ヶ月たった25回。黒 = 急落した日の終値がその後6ヶ月の最安値だった回 -->
    <div class="grid">
      <div class="cell hit"></div><div class="cell hit"></div><div class="cell hit"></div><div class="cell hit"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <p class="big">急落した日が底だったのは<br><strong>25回中4回</strong></p>
    <p class="cap">6ヶ月たった急落のうち、その日の終値が6ヶ月間の最安値だった回</p>
  </div>
  <div class="credit">🌡️ kabuonkei.com</div>
</body>
</html>
